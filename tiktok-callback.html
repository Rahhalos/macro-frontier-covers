<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok authorization — Macro Frontier</title><style>body{background:#0C0A16;color:#E8E8E8;font-family:Inter,Segoe UI,Arial,sans-serif;max-width:720px;margin:48px auto;padding:0 24px;line-height:1.6}h1{font-family:'Space Grotesk',Arial,sans-serif;color:#fff}code,textarea{font-family:'Courier New',monospace}textarea{width:100%;height:120px;background:#14121f;color:#fff;border:1px solid rgba(201,168,76,.4);padding:12px;font-size:14px}small{color:#8890A0}.gold{color:#C9A84C}</style></head><body><h1>TikTok authorization received</h1><p id="status">Reading the response…</p><p>Paste the line below into the terminal command the tool printed:</p><textarea id="out" readonly></textarea><p><small>This page belongs to Macro Frontier's own publishing tool. It stores nothing and sends nothing anywhere; the values are only displayed for you to copy.</small></p><script>(function(){var q=new URLSearchParams(location.search);var code=q.get('code'),state=q.get('state'),err=q.get('error'),desc=q.get('error_description');var s=document.getElementById('status'),o=document.getElementById('out');if(err){s.innerHTML='<span class="gold">TikTok returned an error:</span> '+err+(desc?' — '+desc:'');o.value='error='+err;return;}if(!code){s.textContent='No authorization code in the URL. Start again from the tool.';return;}s.innerHTML='<span class="gold">Authorized.</span> Copy the line below.';o.value='--code '+code+' --state '+(state||'');o.focus();o.select();})();</script></body></html>
